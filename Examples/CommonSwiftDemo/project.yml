# The demo app showing every common-swift package on iPhone, iPad and the Mac, screens in DemoKit.
# XcodeGen writes CommonSwiftDemo.xcodeproj from this file, and git ignores it.
# cspell:ignore mayjournal AMPJZXR xcassets ASSETCATALOG
name: CommonSwiftDemo
options:
  bundleIdPrefix: com.mayjournal
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
packages:
  DemoKit:
    path: DemoKit
  # This repo, for the StorybookHistory plugin, which badges new and changed catalog pages.
  common-swift:
    path: ../..
targets:
  CommonSwiftDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    # A shared scheme, so xcodebuild finds CommonSwiftDemo on a clean checkout.
    scheme: {}
    dependencies:
      - package: DemoKit
        product: DemoKit
    buildToolPlugins:
      - plugin: StorybookHistory
        package: common-swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Common Swift
        # iPad requires all four for multitasking, so the split shows in every window size.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # App/Assets.xcassets only gives the app a Copy Bundle Resources phase.
        # The demo has no icon, so the catalog compiler must not look for an AppIcon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # The owner's individual team; the Makefile's demo target builds without it.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AMPJZXR538
